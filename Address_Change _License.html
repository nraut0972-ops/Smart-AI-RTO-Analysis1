<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Address Change in Driving License</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f9ff;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .note {
      font-size: 13px;
      color: #555;
      margin-top: -12px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Address Change in Driving License</h2>
    <form action="#" method="post">

      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" required>

      <label for="licenseNumber">Driving License Number:</label>
      <input type="text" id="licenseNumber" name="licenseNumber" required>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required>

      <label for="oldAddress">Old Address (as per License):</label>
      <textarea id="oldAddress" name="oldAddress" rows="3" required></textarea>

      <label for="newAddress">New Address:</label>
      <textarea id="newAddress" name="newAddress" rows="3" required></textarea>

      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" required pattern="[0-9]{10}">

      <label for="email">Email ID (optional):</label>
      <input type="email" id="email" name="email">

      <label for="proof">Upload Address Proof Document (PDF or Image):</label>
      <input type="file" id="proof" name="proof" accept=".pdf,image/*" required>

      <label for="declaration">Declaration:</label>
      <textarea id="declaration" name="declaration" rows="3" required>
I hereby request to update my address in the driving license records as per the new address provided above.
      </textarea>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
