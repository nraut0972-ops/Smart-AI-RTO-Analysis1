  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f7;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .search-container {
      background-color: white;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 400px;
    }

    h1 {
      text-align: center;
      color: #0056b3;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      border: 2px solid #ccc;
      border-radius: 5px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      border-color: #0073e6;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      background-color: #0073e6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #005bb5;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      min-height: 120px;
    }

    .result p {
      margin: 8px 0;
      font-size: 1em;
      color: #444;
    }

    .not-found {
      color: #d9534f;
      font-weight: 600;
      text-align: center;
      font-size: 1.1em;
  .small-img {
    width: 100px;
    height: auto;
    border-radius: 5px;
    margin-bottom: 10px;
  }

    function searchVehicle() {
      const input = document.getElementById('vehicleNumber').value.trim().toUpperCase();
      const resultDiv = document.getElementById('result');

      if (!input) {
        resultDiv.innerHTML = '<p class="not-found">Please enter a vehicle number.</p>';
        return;
      }

      if (vehicleData[input]) {
        const details = vehicleData[input];
        resultDiv.innerHTML = `
         <p><strong>Photo:</strong> ${details.image}</p>
          <p><strong>Owner Name:</strong> ${details.owner}</p>
          <p><strong>Address:</strong> ${details.address}</p>
          <p><strong> Mobile No:</strong> ${details. mobileno}</p>
          <p><strong>Vehicle Model:</strong> ${details.model}</p>
<p><strong>Registration RTO:</strong> ${details. registeredrto}</p>
          <p><strong>Registration Date:</strong> ${details.registrationDate}</p>
          <p><strong>RTO Office:</strong> ${details.rto}</p>
          <p><strong>Status:</strong> ${details.status}</p>
        `;
      } else {
        resultDiv.innerHTML = `<p class="not-found">No records found for vehicle number "${input}".</p>`;
      }
    }
