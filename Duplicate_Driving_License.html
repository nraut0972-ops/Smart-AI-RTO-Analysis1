<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Driving License Form</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #e8f0fe;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .note {
            font-size: 14px;
            color: #555;
            margin-top: -10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Duplicate Driving License Application Form</h2>
        <form action="#" method="post">

            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="licenseNumber">Original License Number:</label>
            <input type="text" id="licenseNumber" name="licenseNumber" required>

            <label for="reason">Reason for Duplicate License:</label>
            <select id="reason" name="reason" required>
                <option value="">-- Select Reason --</option>
                <option value="lost">Lost</option>
                <option value="stolen">Stolen</option>
                <option value="damaged">Damaged</option>
                <option value="others">Others</option>
            </select>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="issueDate">Original License Issue Date:</label>
            <input type="date" id="issueDate" name="issueDate">

            <label for="address">Current Address:</label>
            <textarea id="address" name="address" rows="3" required></textarea>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" required pattern="[0-9]{10}">

            <label for="email">Email ID (optional):</label>
            <input type="email" id="email" name="email">

            <label for="photo">Upload Recent Passport Size Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>

            <label for="declaration">Declaration:</label>
            <textarea id="declaration" name="declaration" rows="3" required>
I hereby declare that my original driving license is lost/stolen/damaged. I request the issuing authority to grant me a duplicate license.
            </textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
