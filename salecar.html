<!DOCTYPE html>

    .vehicle-card {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 300px;

    .vehicle-card img {
      width: 100%;

    }

    .vehicle-info {

    }

  width: 100%;

}

.buy-btn:hover {

}


    select {

      font-size: 16px;

      position: absolute;
      top: 10px;

</head>

<!-- Script to Calculate Days & Filter Vehicles -->
<script>
  // Calculate number of days since vehicle was seized
  document.querySelectorAll(".days-since").forEach(function(el) {
    const seizedDate = new Date(el.dataset.date);
    const today = new Date();
    const diffTime = Math.abs(today - seizedDate);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    el.innerText = `${diffDays} Days`;
  });

  // Filter vehicles by selected model
  function filterVehicles() {
    const selectedModel = document.getElementById("modelSelect").value;
    document.querySelectorAll(".vehicle-card").forEach(function(card) {
      if (selectedModel === "All" || card.dataset.model === selectedModel) {
        card.style.display = "block";
      } else {
        card.style.display = "none";
      }
    });
  }
</script>

<!-- Google Translate Script -->
<script type="text/javascript">

        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      },

</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
