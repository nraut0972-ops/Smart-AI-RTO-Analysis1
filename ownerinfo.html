<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Vehicle Information</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f7;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .form-container {
      background-color: white;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 400px;
    }

    h1 {
      text-align: center;
      color: #0056b3;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      color: #333;
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      border: 2px solid #ccc;
      border-radius: 5px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus {
      border-color: #0073e6;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      background-color: #0073e6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>Add Vehicle Info</h1>

    <form action="insert.php" method="POST">

      <label for="vehicleNumber">Vehicle Number</label>
      <input type="text" id="vehicleNumber" name="vehicleNumber" placeholder="e.g., MH12AB1234" required />

      <label for="owner">Owner Name</label>
      <input type="text" id="owner" name="owner" placeholder="Owner's full name" required />

      <label for="model">Vehicle Model</label>
      <input type="text" id="model" name="model" placeholder="e.g., Honda City" required />

      <label for="registrationDate">Registration Date</label>
      <input type="date" id="registrationDate" name="registrationDate" required />

      <label for="rto">RTO Office</label>
      <input type="text" id="rto" name="rto" placeholder="e.g., Pune RTO - MH12" required />

      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="" disabled selected>Select status</option>
        <option value="Active">Active</option>
        <option value="Expired">Expired</option>
        <option value="Suspended">Suspended</option>
      </select>

      <button type="submit">Add Vehicle</button>
    </form>
  </div>

</body>
</html>
